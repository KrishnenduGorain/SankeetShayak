# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sankeetshayak-backend
    runtime: docker
    plan: free
    rootDir: BACKEND
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CLIENT_HOST
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info
