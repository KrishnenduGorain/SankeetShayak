name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest & Integrity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system graphics and EGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libegl1 \
            libgl1 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            xvfb \
            || sudo apt-get install -y libgl1 libglib2.0-0 libegl1 xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite with virtual display
        run: |
          xvfb-run -a pytest tests/ -v
