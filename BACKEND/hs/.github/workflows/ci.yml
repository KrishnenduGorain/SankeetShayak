name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    env:
      HANDSHAYAK_HEADLESS: "1"      # never open OpenCV windows on CI runners
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # System-level rendering libraries (libGL, libEGL, libGLESv2, GLib, X11) - Linux only.
      # Picks libglib2.0-0t64 (Ubuntu 24.04) or libglib2.0-0 (22.04) automatically.
      - name: Install system rendering libraries
        if: runner.os == 'Linux'
        run: bash scripts/install_system_deps.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Verify OpenCV / OpenGL / MediaPipe stack
        run: python scripts/check_env.py --strict

      - name: Download MediaPipe hand model
        continue-on-error: true      # the real-model test is skipped if the download is blocked
        run: python scripts/download_model.py

      - name: Run tests
        run: python -m pytest

      - name: Pipeline self-test (writes an annotated video)
        run: python demo.py --selftest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/
          if-no-files-found: ignore

  gui-xvfb:
    name: GUI path under Xvfb (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: bash scripts/install_system_deps.sh --xvfb
      - run: pip install -r requirements-dev.txt
      - name: A real OpenCV window must open on a virtual display
        run: xvfb-run -a python scripts/check_env.py --strict --require-display
      - run: xvfb-run -a python -m pytest -m gui

  missing-libs:
    name: Missing-library diagnostics (bare container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.12-slim-bookworm      # ships none of the rendering libraries
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Import must fail with an actionable message (exit 1)
        run: |
          set +e
          python scripts/check_env.py --strict
          test $? -eq 1
      - name: Installer repairs it
        run: |
          bash scripts/install_system_deps.sh
          python scripts/check_env.py --strict

  docker:
    name: Docker build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t handshayak-test .
      - run: docker run --rm handshayak-test

  web:
    name: Web prototype (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
        working-directory: web
